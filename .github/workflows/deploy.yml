name: Build Private Mobile (Android APK + Web)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Web Export Directory
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -v -p build/web

      - name: Build Web Mobile Export
        run: |
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Inject COI ServiceWorker for Mobile Browsers
        run: |
          curl -fsSL https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js -o build/web/coi-serviceworker.js
          sed -i 's#<head>#<head><script src="coi-serviceworker.js"></script>#' build/web/index.html

      - name: Upload Private Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildcards-burraco-web
          path: build/web
          retention-days: 14

  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android Export Templates & Keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -v -p build/android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Build Android APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/wildcards-burraco.apk

      - name: Upload Private APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildcards-burraco-apk
          path: build/android/wildcards-burraco.apk
          retention-days: 14
