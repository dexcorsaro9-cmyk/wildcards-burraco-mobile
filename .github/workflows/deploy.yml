name: Build Private Mobile (Android APK + Web)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Web Export Directory
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -v -p build/web

      - name: Build Web Mobile Export
        run: |
          godot --headless --verbose --export-release "Web" build/web/index.html

      - name: Upload Private Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildcards-burraco-web
          path: build/web
          retention-days: 14

  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android Export Templates & Keystore
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/ || true
          mkdir -v -p build/android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$(pwd)/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999

      - name: Install Android Gradle Build Template
        run: |
          unzip -o -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d android/build
          echo "4.3.stable" > android/build/.build_version

      - name: Configure Android SDK & Java Paths in Editor Settings
        run: |
          mkdir -v -p ~/.config/godot
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"'
            echo 'export/android/android_sdk_path = "/usr/lib/android-sdk"'
            echo "export/android/debug_keystore = \"$(pwd)/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
            echo 'export/android/force_system_user = false'
            echo 'export/android/timestamping_authority_url = ""'
            echo 'export/android/shutdown_adb_on_exit = true'
          } > ~/.config/godot/editor_settings-4.3.tres

      - name: Build Android APK
        run: |
          godot --headless --verbose --export-debug "Android" build/android/wildcards-burraco.apk

      - name: Upload Private APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wildcards-burraco-apk
          path: build/android/wildcards-burraco.apk
          retention-days: 14
